name: Release to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Verify package name and version
        run: |
          node - <<'SCRIPT'
          const pkg = require('./package.json');
          console.log('Publishing:', pkg.name + '@' + pkg.version);
          if (pkg.name !== 'vilvona') { console.error('Wrong package name'); process.exit(1); }
          if (!pkg.bin?.vilvona) { console.error('bin.vilvona missing'); process.exit(1); }
          console.log('Package checks passed');
          SCRIPT

      - name: Validate launcher syntax
        run: node --check openclaw.mjs && echo "Launcher syntax OK"

      - name: Publish to npm
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Vilvona AI ${{ github.ref_name }}

            Install or update:
            ```bash
            npx vilvona@latest
            ```

            Or:
            ```bash
            npm install -g vilvona@latest
            ```

            **What's new:** See commit history for changes.

            **Payment:** [vignesh2027.mojo.page/vilvona-ai-pro](https://vignesh2027.mojo.page/vilvona-ai-pro)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: publish
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build and push image
        uses: docker/build-push-action@v6.17.0
        with:
          context: docker
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/vignesh2027/vilvona-ai:latest
            ghcr.io/vignesh2027/vilvona-ai:${{ github.ref_name }}
